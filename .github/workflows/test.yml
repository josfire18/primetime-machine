name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run roku         # compile and validate the Roku channel, build its sideload zip
      # The TV screen in a real browser against a real station and real video.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q playwright==1.63.0 && python -m playwright install --with-deps chromium
      - run: python ui/test/e2e.py
      # The desktop app: Electron plays H.264 from the in-process station.
      - run: python app/test/app_e2e.py
