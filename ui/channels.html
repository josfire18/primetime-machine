<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channels · Primetime Machine</title>
<link rel="stylesheet" href="/editor.css">
<link rel="stylesheet" href="/channels.css">
</head>
<body>
<header>
  <h1>Channels</h1>
  <span id="mode" class="dim"></span>
  <a href="/" class="back">Back to TV</a>
</header>
<div class="layout">
  <aside>
    <ol id="lineup"></ol>
    <div class="row">
      <button id="add" class="primary">Add channel</button>
      <button id="import">Import…</button>
      <button id="export">Export lineup</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
    </div>
  </aside>
  <main id="form" hidden>
    <div class="grid2">
      <label>Number <input id="f-number" type="number" min="1" max="999" required></label>
      <label>Name <input id="f-name" maxlength="40" required></label>
    </div>
    <h2>Years</h2>
    <div class="grid2">
      <label>From <input id="f-from" type="number" min="1900" max="2100"></label>
      <label>To <input id="f-to" type="number" min="1900" max="2100"></label>
    </div>
    <div id="decades" class="chips"></div>
    <h2>What airs</h2>
    <div class="row">
      <label class="check"><input id="f-episodes" type="checkbox"> TV shows</label>
      <label class="check" id="movies-box"><input id="f-movies" type="checkbox"> Movies</label>
    </div>
    <div id="show-pick">
      <div class="row">
        <label class="check"><input id="f-allshows" type="checkbox"> Every show from those years</label>
        <input id="show-filter" type="search" placeholder="Find a show" autocomplete="off">
      </div>
      <ul id="shows" class="shows"></ul>
    </div>
    <div id="genre-pick" hidden><h2>Genres</h2><div id="genres" class="chips"></div></div>
    <div id="network-pick" hidden><h2>Networks</h2><div id="networks" class="chips"></div></div>
    <h2>Guide</h2>
    <div class="row">
      <label>Time slots
        <select id="f-slot">
          <option value="15">15 minutes</option><option value="30">30 minutes</option>
          <option value="60">1 hour</option><option value="90">90 minutes</option>
          <option value="120">2 hours</option><option value="180">3 hours</option>
        </select>
      </label>
      <button id="reshuffle" title="Same shows, a different order">Reshuffle</button>
    </div>
    <div id="preview" class="preview"></div>
    <div class="row">
      <button id="dup">Duplicate</button>
      <button id="export-one">Export this channel</button>
      <span class="gap"></span>
      <button id="del">Delete channel</button>
    </div>
  </main>
  <main id="empty" class="dim">Pick a channel, or add one.</main>
</div>
<footer>
  <span id="dirty" class="dirty" hidden>unsaved</span>
  <span id="error" class="error" hidden></span>
  <span class="gap"></span>
  <button id="auto" title="One channel per decade your library covers">Back to automatic</button>
  <button id="discard" disabled>Discard changes</button>
  <button id="save" class="primary" disabled>Save lineup</button>
</footer>
<script src="/channels.js"></script>
</body>
</html>
